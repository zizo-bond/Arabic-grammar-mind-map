<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>خريطة ذهنية وتدريب تفاعلي للإعراب</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --bg:#071022;
      --card-bg: rgba(15,23,42,0.7);
      --accent1: #10b981;
      --accent2: #3b82f6;
      --accent3: #8b5cf6;
      --glass: rgba(255,255,255,0.04);
    }
    /* عام */
    html,body{height:100%}
    body{
      font-family: 'Cairo', sans-serif;
      margin:0;
      background: linear-gradient(180deg,#051124 0%, var(--bg) 60%);
      -webkit-font-smoothing:antialiased;
      color:#e6eef8;
      padding:0;
    }

    /* النافبار */
    .navbar {
      background: linear-gradient(135deg, rgba(21, 3, 63, 0.95), rgba(4, 28, 66, 0.95));
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar a {
      position: relative;
      transition: all 0.3s ease;
    }

    .navbar a:hover {
      color: #fbbf24 !important;
      transform: translateY(-2px);
    }

    .navbar a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: #fbbf24;
      transition: width 0.3s ease;
    }

    .navbar a:hover::after {
      width: 100%;
    }

    #mindmap-app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:24px;}

    /* عنوان */
    .page-title{ text-align:center; margin-bottom:18px; }
    .page-title h1{
      font-weight:900;
      font-size:2.4rem;
      background: linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      animation: titlePulse 3s ease-in-out infinite;
    }
    @keyframes titlePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    .page-title p{color:#9fb2d3;margin-top:6px;}

    /* الخريطة */
    #mindmap{
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:18px;
      margin-top:14px;
      flex-wrap:wrap;
      padding:20px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      border: 1px solid rgba(255,255,255,0.03);
      min-height:260px;
      position: relative;
    }

    /* كرت */
    .node-card{
      min-width:140px;
      max-width:320px;
      padding:18px;
      padding-top: 38px;
      border-radius:12px;
      backdrop-filter: blur(8px);
      background: var(--card-bg);
      border:1px solid rgba(255,255,255,0.04);
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
      cursor:pointer;
      transition: transform .28s cubic-bezier(.2,.9,.3,1), box-shadow .28s, opacity .28s;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .node-card:hover{ 
      transform: translateY(-6px) scale(1.02); 
      box-shadow: 0 18px 40px rgba(11, 78, 92, 0.35);
    }
    .node-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg);
      transition: all 0.5s;
    }
    .node-card:hover::before {
      left: 100%;
    }
    .node-card .title{ font-weight:800; font-size:1.05rem; color:#fff; letter-spacing:.2px; margin-bottom:6px; }
    .node-card .info{ font-size:.9rem; color:#cbd8ee; opacity:.95; margin-top:6px; line-height:1.35; }

    /* شرائط لونية بمستوى */
    .level-0{ border-left:6px solid var(--accent1); }
    .level-1{ border-left:6px solid var(--accent2); }
    .level-2{ border-left:6px solid var(--accent3); }
    .level-3{ border-left:6px solid #ec4899; }
    .level-4{ border-left:6px solid #f59e0b; }
    .level-5{ border-left:6px solid #06b6d4; }

    /* أيقونة السهم (التنقل) */
    .toggle-icon{
      position:absolute;
      bottom:10px;
      left:10px;
      width:36px;height:36px;
      display:flex;align-items:center;justify-content:center;
      background: rgba(255,255,255,0.03);
      border-radius:10px;
      font-size:14px;color:#dff3ff;
      transition: transform .24s;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    
    /* أيقونة الشرح (i) */
    .info-icon{
      position:absolute;
      top:10px;
      left:10px;
      width:28px;height:28px;
      display:flex;align-items:center;justify-content:center;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius:50%;
      font-size:16px; 
      font-weight: 700;
      color:var(--accent2);
      cursor: help;
      transition: all .24s;
      z-index: 5;
    }
    .info-icon:hover {
      background: var(--accent2);
      color: var(--bg);
      transform: scale(1.1) rotate(180deg);
      box-shadow: 0 0 15px var(--accent2);
    }
    
    /* خطوط الربط المتحركة */
    .connection-line{
      width:3px;
      height:34px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      margin:8px auto 0;
      border-radius:3px;
      opacity:.7;
      position: relative;
      overflow: hidden;
    }
    .connection-line::after {
      content: '';
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, transparent, var(--accent1), transparent);
      animation: flowDown 2s infinite;
    }
    @keyframes flowDown {
      0% { top: -100%; }
      100% { top: 100%; }
    }

    /* سهم متفرع - تحسين */
    .branch-arrow {
      position: absolute;
      width: 2px;
      background: linear-gradient(180deg, var(--accent2), transparent);
      opacity: 0.5;
      animation: arrowGrow 0.5s ease-out forwards;
    }
    @keyframes arrowGrow {
      from { height: 0; }
      to { height: 40px; }
    }

    .fade-in{ animation: fadeUp .45s cubic-bezier(.2,.9,.3,1) both; }
    @keyframes fadeUp{
      from{ opacity:0; transform: translateY(10px) scale(.98); }
      to{ opacity:1; transform: translateY(0) scale(1); }
    }

    /* breadcrumb */
    .breadcrumb{
      display:flex;
      gap:8px;
      justify-content:center;
      margin-top:14px;
      margin-bottom:6px;
      flex-wrap:wrap;
    }
    .crumb{
      background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      padding:8px 12px;
      border-radius:999px;
      color:#cfe8ff;
      font-weight:600;
      font-size:.95rem;
      border:1px solid rgba(255,255,255,0.03);
      transition: all 0.3s ease;
    }
    .crumb:hover {
      background: linear-gradient(90deg, rgba(16,185,129,0.2), rgba(59,130,246,0.2));
      transform: scale(1.05);
    }

    /* زر العودة */
    .back-btn{
      display:inline-flex;
      gap:8px;
      align-items:center;
      background: linear-gradient(90deg,var(--accent1),var(--accent2));
      color:#012026;
      padding:8px 14px;
      border-radius:999px;
      font-weight:700;
      cursor:pointer;
      border:none;
      box-shadow: 0 8px 24px rgba(16,185,129,0.09);
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(16,185,129,0.2);
    }

    /* نافذة الشرح (Modal) */
    #modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeInModal .3s both;
    }
    #modal-content {
      background: var(--card-bg);
      border: 1px solid var(--glass);
      padding: 24px;
      border-radius: 14px;
      max-width: 500px;
      width: 90%;
      color: #e6eef8;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      position: relative;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    #modal-close {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      line-height: 1;
      transition: all 0.3s ease;
    }
    #modal-close:hover { 
      color: var(--accent1);
      transform: rotate(90deg);
    }
    #modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent1);
      margin-bottom: 12px;
      padding-left: 20px;
    }
    #modal-body {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #dbeaff;
    }
    @keyframes fadeInModal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* استجابة */
    @media (max-width:900px){
      #mindmap{ padding:14px; gap:12px; }
      .node-card{ max-width:240px; padding:14px; padding-top: 38px;}
      .page-title h1{ font-size:1.8rem; }
    }
  </style>

  <style>
    #interactive-quiz-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 24px;
      background: var(--card-bg);
      border: 1px solid var(--glass);
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    .quiz-title {
      font-weight: 800;
      font-size: 1.8rem;
      text-align: center;
      background: linear-gradient(90deg, var(--accent1), var(--accent3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 20px;
    }
    #quiz-sentence {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      color: #fff;
      margin-bottom: 20px;
      line-height: 1.8;
      padding: 15px;
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
    }
    #quiz-sentence .highlight {
      background-color: var(--accent3);
      color: #fff;
      padding: 2px 8px;
      border-radius: 6px;
      box-shadow: 0 0 15px var(--accent3);
      animation: highlightPulse 2s infinite;
    }
    @keyframes highlightPulse {
      0%, 100% { box-shadow: 0 0 15px var(--accent3); }
      50% { box-shadow: 0 0 25px var(--accent3); }
    }
    #quiz-question {
      font-size: 1.2rem;
      font-weight: 700;
      color: #e6eef8;
      text-align: center;
      margin-bottom: 20px;
    }
    #quiz-options {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .quiz-option {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 2px solid rgba(255,255,255,0.1);
      padding: 12px 20px;
      border-radius: 10px;
      color: #cfe8ff;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all .2s ease-in-out;
      position: relative;
      overflow: hidden;
    }
    .quiz-option::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(59,130,246,0.3);
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s;
    }
    .quiz-option:hover::before {
      width: 300px;
      height: 300px;
    }
    .quiz-option:hover {
      background: var(--accent2);
      color: var(--bg);
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      border-color: var(--accent2);
    }
    #quiz-feedback {
      text-align: center;
      margin-top: 20px;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.7;
    }
    #quiz-feedback .final-answer {
      color: var(--accent1);
      background: rgba(16, 185, 129, 0.1);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--accent1);
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    #quiz-nav {
      text-align: center;
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }
    #quiz-nav button {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #012026;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-size: 1rem;
      box-shadow: 0 8px 24px rgba(16,185,129,0.2);
      transition: all 0.3s ease;
    }
    #quiz-nav button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(16,185,129,0.3);
    }
    #quiz-nav button:disabled {
      background: #555;
      color: #999;
      cursor: not-allowed;
      opacity: 0.6;
    }
    #quiz-counter {
      font-weight: 600;
      color: var(--accent3);
      font-size: 1.1rem;
    }
  </style>
  </head>
<body>
  
  <!-- النافبار -->
  <nav class="navbar">
    <div class="container mx-auto px-6 py-3">
      <div class="flex justify-between items-center">
        <div class="text-2xl font-bold text-white">اختباراتي</div>
        <div class="flex items-center space-x-6 space-x-reverse">
          <div class="hidden md:flex space-x-4 space-x-reverse">
            <a href="index.html" class="text-white hover:text-purple-600 transition-colors">الرئيسية</a>

            <a href="contact.html" class="text-white hover:text-purple-600 transition-colors">تواصل معنا</a>
          </div>
          <div id="auth-container">

              <div class="bg-white bg-opacity-20 rounded-lg h-10 w-24"></div>

          <button id="mobile-menu-btn" class="md:hidden text-white hover:text-purple-300">

      </div>
    </div>
  </nav>

  <div id="mindmap-app">
    <div class="page-title">
      <h1>خريطة ذهنية للإعراب</h1>
      <p>تابع الخطوات المرتبة: اختر نوع الكلمة ← ثم موقعها ← ثم احتمالات إعرابها</p>
    </div>

    <div class="breadcrumb" id="breadcrumb"></div>

    <div id="mindmap" aria-live="polite"></div>

  </div>

  <div id="modal-overlay">
    <div id="modal-content">
      <span id="modal-close">&times;</span>
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
    </div>
  </div>

  <div id="interactive-quiz-container">
    <h2 class="quiz-title">🚀 تدريب إعرابي تفاعلي</h2>
    
    <div id="quiz-nav">
      <button id="prev-quiz" disabled>السابق</button>
      <span id="quiz-counter"></span>
      <button id="next-quiz">التالي</button>
    </div>
    
    <div id="quiz-sentence"></div>
    <div id="quiz-question"></div>
    <div id="quiz-options"></div>
    <div id="quiz-feedback"></div>
  </div>

  <script>
    // Mobile menu toggle
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });

    /******** DATA ********/
    const grammarData = {
      id: 'root',
      title: 'الكلمة',
      children: [
        {
          id: 'ism',
          title: 'اسم',
          explanation: 'ما دل على معنى في نفسه ولم يقترن بزمن، مثل (إنسان، حيوان، جماد، صفة، معنى).',
          children: [
            {
              id: 'ism-types',
              title: 'أنواع الاسم',
              explanation: 'الاسم ينقسم إلى معرب ومبني حسب تغير آخره أو ثباته.',
              children: [
                {
                  id: 'ism-morab',
                  title: 'اسم معرب',
                  explanation: 'الاسم الذي يتغير شكل آخره (حركته) حسب موقعه في الجملة (مثل: جاء محمدٌ، رأيت محمداً، مررت بمحمدٍ).',
                  children: [
                    {
                      id: 'ism-morab-positions',
                      title: 'موقع الاسم في الجملة',
                      explanation: 'اختر موقع الاسم لمعرفة حالته الإعرابية وعلاماتها.',
                      children: [
                        {
                          id: 'marfoo-positions',
                          title: '1️⃣ مواقع الرفع',
                          explanation: 'اختر موقع الاسم المرفوع في الجملة.',
                          children: [
                            { 
                              id: 'r-mubtada', 
                              title: 'المبتدأ', 
                              info: 'نحو: السماءُ صافيةٌ', 
                              explanation: 'الاسم المرفوع الذي تبدأ به الجملة الاسمية.',
                              children: [
                                {
                                  id: 'mubtada-signs',
                                  title: 'علامات رفع المبتدأ',
                                  children: [
                                    { id: 'mubtada-damah', title: 'بالضمة', info: 'المفرد وجمع التكسير وجمع المؤنث السالم' },
                                    { id: 'mubtada-waw', title: 'بالواو', info: 'جمع المذكر السالم والأسماء الخمسة' },
                                    { id: 'mubtada-alif', title: 'بالألف', info: 'المثنى' }
                                  ]
                                }
                              ]
                            },
                            { 
                              id: 'r-khabar', 
                              title: 'الخبر', 
                              info: 'نحو: السماءُ صافيةٌ', 
                              explanation: 'الاسم المرفوع الذي يُخبر به عن المبتدأ ويتمم معنى الجملة.',
                              children: [
                                {
                                  id: 'khabar-signs',
                                  title: 'علامات رفع الخبر',
                                  children: [
                                    { id: 'khabar-damah', title: 'بالضمة', info: 'المفرد وجمع التكسير وجمع المؤنث السالم' },
                                    { id: 'khabar-waw', title: 'بالواو', info: 'جمع المذكر السالم والأسماء الخمسة' },
                                    { id: 'khabar-alif', title: 'بالألف', info: 'المثنى' }
                                  ]
                                }
                              ]
                            },
                            { 
                              id: 'r-fael', 
                              title: 'الفاعل', 
                              info: 'نحو: جاءَ محمدٌ', 
                              explanation: 'الاسم المرفوع الذي قام بالفعل أو اتصف به. نسأل عنه بـ (مَن؟) أو (ما؟). قد يكون عامله فعلاً (جاء محمدٌ) أو اسم فعل (هيهاتَ العُلُّمُ).',
                              children: [
                                {
                                  id: 'fael-signs',
                                  title: 'علامات رفع الفاعل',
                                  children: [
                                    { id: 'fael-damah', title: 'بالضمة', info: 'المفرد وجمع التكسير وجمع المؤنث السالم' },
                                    { id: 'fael-waw', title: 'بالواو', info: 'جمع المذكر السالم والأسماء الخمسة' },
                                    { id: 'fael-alif', title: 'بالألف', info: 'المثنى' }
                                  ]
                                }
                              ]
                            },
                            { 
                              id: 'r-naeb-fael', 
                              title: 'نائب الفاعل', 
                              info: 'نحو: كُتِبَ الدرسُ',
                              explanation: 'اسم مرفوع يحل محل الفاعل بعد حذفه، ويأتي مع الفعل المبني للمجهول (المضموم أوله).',
                              children: [
                                {
                                  id: 'naeb-signs',

    /******** STATE ********/
    let currentPath = [];
    const mindmapEl = document.getElementById('mindmap');
    const breadcrumbEl = document.getElementById('breadcrumb');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const modalClose = document.getElementById('modal-close');
    
    /******** HELPERS ********/
    function findNodeById(node, id){
      if(node.id === id) return node;
      if(!node.children) return null;
      for(const c of node.children){
        const found = findNodeById(c, id);
        if(found) return found;
      }
      return null;
    }

    function getNodeTitlePath(){
      return currentPath.map(id => {
        const n = findNodeById(grammarData,id);
        return n? n.title : id;
      });
    }

    /******** RENDERING ********/
    function renderBreadcrumb(){
      breadcrumbEl.innerHTML = '';
      const path = ['الكلمة', ...getNodeTitlePath()];
      path.forEach((p, idx) => {
        const span = document.createElement('div');
        span.className = 'crumb';
        span.textContent = p;
        breadcrumbEl.appendChild(span);
      });
      if(currentPath.length > 0){
        const back = document.createElement('button');
        back.className = 'back-btn ml-2';
        back.innerHTML = '⬅ العودة';
        back.onclick = () => {
          currentPath.pop();
          render();
        };
        breadcrumbEl.prepend(back);
      }
    }

    function createCard(node, level = 0){
      const el = document.createElement('div');
      el.className = `node-card level-${Math.min(level,5)} fade-in`;
      el.setAttribute('data-id', node.id);
      
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = node.title;
      el.appendChild(title);
      if(node.info){
        const info = document.createElement('div');
        info.className = 'info';
        info.textContent = node.info;
        el.appendChild(info);
      }

      if(node.children && node.children.length > 0){
        const icon = document.createElement('div');
        icon.className = 'toggle-icon';
        icon.innerHTML = '&#x25BC;';
        el.appendChild(icon);
      }
      
      if(node.explanation){
        const infoIcon = document.createElement('div');
        infoIcon.className = 'info-icon';
        infoIcon.innerHTML = '&#9432;';
        infoIcon.addEventListener('click', (e) => {
          e.stopPropagation();
          showExplanation(node.title, node.explanation);
        });
        el.appendChild(infoIcon);
      }

      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        if(node.children && node.children.length > 0){
          currentPath.push(node.id);
          render();
          return;
        }
        el.animate([{transform:'scale(1)'},{transform:'scale(0.99)'},{transform:'scale(1)'}],{duration:220,fill:'both'});
      });
      return el;
    }

    function renderNodesFor(node, level = 0){
      const container = document.createElement('div');
      container.className = 'flex flex-wrap justify-center gap-6';
      if(!node.children) return container;
      node.children.forEach(child=>{
        const col = document.createElement('div');
        col.style.display = 'flex';
        col.style.flexDirection = 'column';
        col.style.alignItems = 'center';
        const card = createCard(child, level);
        col.appendChild(card);
        if(child.children && child.children.length > 0){
          const line = document.createElement('div');
          line.className = 'connection-line';
          col.appendChild(line);
        }
        container.appendChild(col);
      });
      return container;
    }

    function render(){
      mindmapEl.innerHTML = '';
      if(currentPath.length === 0){
        const root = grammarData;
        const nodesWrap = document.createElement('div');
        nodesWrap.className = 'flex flex-wrap justify-center gap-6';
        root.children.forEach(child=>{
          const card = createCard(child, 0);
          nodesWrap.appendChild(card);
        });
        mindmapEl.appendChild(nodesWrap);
      } else {
        const lastId = currentPath[currentPath.length - 1];
        const lastNode = findNodeById(grammarData, lastId);
        if(!lastNode){
          currentPath = [];
          render();
          return;
        }
        const branchTitle = document.createElement('div');
        branchTitle.style.width = '100%';
        branchTitle.style.textAlign = 'center';
        branchTitle.style.marginBottom = '10px';
        branchTitle.innerHTML = `<div style="font-weight:900;font-size:1.05rem;color:#dff6ff">${lastNode.title}</div>`;
        mindmapEl.appendChild(branchTitle);

        const nodesContainer = renderNodesFor(lastNode, 1);
        mindmapEl.appendChild(nodesContainer);
      }
      renderBreadcrumb();
    }

    function showExplanation(title, explanation){
      modalTitle.textContent = title;
      modalBody.textContent = explanation;
      modalOverlay.style.display = 'flex';
    }
    
    function hideExplanation(){
      modalOverlay.style.display = 'none';
    }
    
    modalClose.addEventListener('click', hideExplanation);
    modalOverlay.addEventListener('click', (e) => {
      if(e.target === modalOverlay){
        hideExplanation();
      }
    });
    render();

    document.addEventListener('click', (e)=>{
      const isInsideApp = e.target.closest && e.target.closest('#mindmap-app');
      if(!isInsideApp && currentPath.length > 0){
        if(modalOverlay.style.display === 'flex') return;
        currentPath.pop();
        render();
      }
    });

    // 2. متغيرات حالة التدريب
    let currentQuizIndex = 0;
    let currentStepIndex = 0;
    let quizActive = true;

    // 3. جلب عناصر الـ HTML للتدريب
    const quizSentenceEl = document.getElementById('quiz-sentence');
    const quizQuestionEl = document.getElementById('quiz-question');
    const quizOptionsEl = document.getElementById('quiz-options');
    const quizFeedbackEl = document.getElementById('quiz-feedback');
    const nextQuizBtn = document.getElementById('next-quiz');
    const prevQuizBtn = document.getElementById('prev-quiz');
    const quizCounterEl = document.getElementById('quiz-counter');

    // 4. وظائف التدريب
    function startInteractiveQuiz(index) {
      currentQuizIndex = index;
      currentStepIndex = 0;
      quizActive = true;
      
      // تحديث أزرار التنقل
      quizCounterEl.textContent = `التدريب ${index + 1} / ${quizData.length}`;
      prevQuizBtn.disabled = (index === 0);
      nextQuizBtn.disabled = (index === quizData.length - 1);
      
      const quiz = quizData[currentQuizIndex];
      
      // 1. عرض الجملة وتظليل الكلمة
      quizSentenceEl.innerHTML = quiz.sentence.replace(quiz.word, `<span class="highlight">${quiz.word}</span>`);
      
      // 2. عرض الخطوة الأولى
      renderQuizStep();
    }

    function renderQuizStep() {
      quizFeedbackEl.innerHTML = '';
      const quiz = quizData[currentQuizIndex];
      const step = quiz.steps[currentStepIndex];

      // 1. عرض السؤال
      quizQuestionEl.textContent = step.question;

      // 2. عرض الخيارات
      quizOptionsEl.innerHTML = '';
      step.options.forEach((option, index) => {
        const optionBtn = document.createElement('button');
        optionBtn.className = 'quiz-option';
        optionBtn.textContent = option;
        optionBtn.onclick = () => handleOptionSelect(index);
        quizOptionsEl.appendChild(optionBtn);
      });
    }

    function handleOptionSelect(selectedIndex) {
      if (!quizActive) return;

      const quiz = quizData[currentQuizIndex];
      const step = quiz.steps[currentStepIndex];

      if (selectedIndex === step.correctIndex) {
        // إجابة صحيحة
        quizFeedbackEl.innerHTML = `<span style="color: var(--accent1); font-size: 1.1rem;">✓ إجابة صحيحة!</span>`;
        
        // تأثير نجاح
        const correctBtn = quizOptionsEl.children[selectedIndex];
        correctBtn.style.background = 'var(--accent1)';
        correctBtn.style.color = 'white';
        
        setTimeout(() => {
          currentStepIndex++;
          if (currentStepIndex < quiz.steps.length) {
            renderQuizStep();
          } else {
            showFinalIraab();
          }
        }, 800);
      } else {
        // إجابة خاطئة
        quizFeedbackEl.innerHTML = `<span style="color: #f87171;">✗ حاول مرة أخرى! فكر جيداً.</span>`;
        
        // اهتزاز بسيط للزر الخطأ
        const wrongBtn = quizOptionsEl.children[selectedIndex];
        wrongBtn.style.background = '#ef4444';
        wrongBtn.style.color = 'white';
        
        wrongBtn.animate([
          { transform: 'translateX(0)' },
          { transform: 'translateX(-10px)' },
          { transform: 'translateX(10px)' },
          { transform: 'translateX(0)' }
        ], { duration: 300 });
        
        setTimeout(() => {
          wrongBtn.style.background = '';
          wrongBtn.style.color = '';
        }, 1000);
      }
    }

    function showFinalIraab() {
      quizActive = false;
      const quiz = quizData[currentQuizIndex];
      quizQuestionEl.innerHTML = '<span style="color: var(--accent1); font-size: 1.3rem;">🎉 أحسنت! لقد وصلت للإعراب الصحيح.</span>';
      quizOptionsEl.innerHTML = '';
      quizFeedbackEl.innerHTML = `<div class="final-answer"><strong>الإعراب الكامل:</strong><br>${quiz.finalIraab}</div>`;
    }

    // 5. ربط أزرار التنقل
    nextQuizBtn.addEventListener('click', () => {
      if (currentQuizIndex < quizData.length - 1) {
        startInteractiveQuiz(currentQuizIndex + 1);
      }
    });

    prevQuizBtn.addEventListener('click', () => {
      if (currentQuizIndex > 0) {
        startInteractiveQuiz(currentQuizIndex - 1);
      }
    });

    // 6. بدء التدريب التفاعلي الأول عند تحميل الصفحة
    startInteractiveQuiz(0);
